spring:
  application:
    name: clubflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clubflow}
    username: ${DB_USER:clubflow}
    password: ${DB_PASSWORD:clubflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway (db/migration)
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 32
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  port: ${PORT:8080}
  forward-headers-strategy: native
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  timezone: ${APP_TIMEZONE:Asia/Kolkata}      # used when formatting deadlines in emails
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:ClubFlow <no-reply@clubflow.local>}
    dispatch-interval-ms: ${MAIL_DISPATCH_INTERVAL_MS:10000}
    max-attempts: ${MAIL_MAX_ATTEMPTS:5}
  reminders:
    first-hours: 24
    second-hours: 3
    scan-interval-ms: ${REMINDER_SCAN_INTERVAL_MS:60000}
  storage:
    dir: ${UPLOAD_DIR:./uploads}
  seed:
    enabled: ${SEED_ENABLED:true}
    superadmin-name: ${SUPERADMIN_NAME:Super Admin}
    superadmin-email: ${SUPERADMIN_EMAIL:admin@clubflow.local}
    superadmin-password: ${SUPERADMIN_PASSWORD:ChangeMe123!}
    demo-data: ${SEED_DEMO_DATA:false}
  rate-limit:
    auth-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
